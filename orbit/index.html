<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Orbit Hop</title>
<meta name="description" content="Tap to leap from ring to ring. Skip rings for bonus points. How far can you go?">
<meta name="theme-color" content="#0B1437">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/orbit.png">
<link rel="apple-touch-icon" href="../icons/app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap Arcade">
<style>
  html, body { margin: 0; height: 100%; background: #0B1437; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  @media (min-width: 700px) and (min-height: 480px) {
    html, body { background: #0B0C10; }
    #app { left: 50%; right: auto; width: min(100vw, calc(100vh * 0.6)); transform: translateX(-50%); box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 90px rgba(0,0,0,.65); }
  }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0B1437; color: #fff; font: 600 15px system-ui, sans-serif; transition: opacity .3s; z-index: 5; }
  #loading img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #loading .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px; animation: slide 1s ease-in-out infinite; }
  #loading p { margin: 0 24px; max-width: 320px; text-align: center; font-weight: 400; opacity: .85; }
  #loading a { color: #fff; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
<script src="../shared/axar.js"></script>
<meta property="og:type" content="website"><meta property="og:title" content="Orbit Hop · Tap Arcade"><meta property="og:description" content="Tap to leap from ring to ring. Skip rings for bonus points. How far can you go?"><meta property="og:image" content="https://axarapps.github.io/games/og/orbit.png"><meta property="og:url" content="https://axarapps.github.io/games/orbit/"><meta name="twitter:card" content="summary_large_image"></head>
<body>
<div id="app"></div>
<div id="loading"><img src="../icons/orbit.png" alt=""><div class="bar"><i></i></div></div>
<script>axar.boot("orbit.js");</script>
</body>
</html>
