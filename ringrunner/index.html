<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ring Runner</title>
<meta name="description" content="Circle the track, switch lanes and dodge the blocks. Inner lanes pay more.">
<meta name="theme-color" content="#06201A">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/ringrunner.png">
<link rel="apple-touch-icon" href="../icons/app-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tap Arcade">
<style>
  html, body { margin: 0; height: 100%; background: #06201A; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #06201A; color: #fff; font: 600 15px system-ui, sans-serif; transition: opacity .3s; z-index: 5; }
  #loading img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #loading .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
  #loading .bar i { display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px; animation: slide 1s ease-in-out infinite; }
  #loading p { margin: 0 24px; max-width: 320px; text-align: center; font-weight: 400; opacity: .85; }
  #loading a { color: #fff; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
<script src="../shared/axar.js"></script>
</head>
<body>
<div id="app"></div>
<div id="loading"><img src="../icons/ringrunner.png" alt=""><div class="bar"><i></i></div></div>
<script>axar.boot("ringrunner.js");</script>
</body>
</html>
